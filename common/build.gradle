plugins {
	id 'me.champeau.jmh'
}

base {
	archivesName = "${rootProject.archives_base_name}-common"
}

// Loom supplies Minecraft and Yarn for compilation; common has no loader dependency.
loom {
	runs.configureEach {
		ideConfigGenerated = false
	}
}

tasks.named('remapJar') {
	enabled = false
}

tasks.named('remapSourcesJar') {
	enabled = false
}

sourceSets {
	smoke
}

def commonJar = tasks.named('jar').flatMap { it.archiveFile }
def verifyCommonJar = tasks.register('verifyCommonJar', JavaExec) {
	group = 'verification'
	description = 'Checks established JVM methods and common class loading without client or Fabric access.'
	classpath = sourceSets.smoke.output
	mainClass = 'com.github.mystery2099.voxlib.smoke.CommonJarSmokeCheck'
	javaLauncher = javaToolchains.launcherFor(java.toolchain)
	inputs.file(commonJar)
	inputs.files(configurations.runtimeClasspath)
	doFirst {
		args = [commonJar.get().asFile.absolutePath, configurations.runtimeClasspath.asPath]
	}
}

tasks.named('check') {
	dependsOn verifyCommonJar
}

jmh {
	jmhVersion = project.jmh_version
	benchmarkMode = ['avgt']
	timeUnit = 'ns'
	warmupIterations = 3
	warmup = '500ms'
	iterations = 5
	timeOnIteration = '500ms'
	fork = 3
	profilers = ['gc']
	jvmArgsAppend = ['-Dorg.apache.logging.log4j.simplelog.StatusLogger.level=OFF']
	resultFormat = 'JSON'
	resultsFile = project.file("${layout.buildDirectory.get()}/reports/jmh/results.json")
	humanOutputFile = project.file("${layout.buildDirectory.get()}/reports/jmh/human.txt")
	failOnError = true
	zip64 = true
	duplicateClassesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('verifyPerformance') {
	dependsOn tasks.jmh
	doLast {
		def reportFile = layout.buildDirectory.file('reports/jmh/results.json').get().asFile
		def results = new groovy.json.JsonSlurper().parse(reportFile)
		def findResult = { suffix, parameters ->
			def result = results.find {
				it.benchmark.endsWith(".${suffix}") &&
					parameters.every { key, value -> it.params[key] == value.toString() }
			}
			if (result == null) {
				throw new GradleException("Missing JMH result for ${suffix} with ${parameters}")
			}
			return result
		}
		def findScore = { suffix, parameters, metric ->
			def result = findResult(suffix, parameters)
			def metricResult = metric == 'primary'
				? result.primaryMetric
				: result.secondaryMetrics[metric]
			if (metricResult == null) {
				throw new GradleException(
					"Missing JMH metric ${metric} for ${suffix} with ${parameters}"
				)
			}
			return metricResult.score as double
		}
		def requireMetricAtMost = {
			candidate,
			baseline,
			parameters,
			ratio,
			metric ->
			def candidateScore = findScore(candidate, parameters, metric)
			def baselineScore = findScore(baseline, parameters, metric)
			if (candidateScore > baselineScore * ratio) {
				throw new GradleException(
					"${candidate} ${metric} was ${candidateScore / baselineScore}x " +
						"${baseline}; limit is ${ratio}x"
				)
			}
		}
		def requireAtMost = { candidate, baseline, parameters, ratio ->
			requireMetricAtMost(candidate, baseline, parameters, ratio, 'primary')
		}
		def requireAtMostUnlessInconclusive = { candidate, baseline, parameters, ratio ->
			def candidateResult = findResult(candidate, parameters).primaryMetric
			def baselineResult = findResult(baseline, parameters).primaryMetric
			def exceedsLimit = candidateResult.score > baselineResult.score * ratio
			def significantlyExceedsLimit =
				candidateResult.scoreConfidence[0] > baselineResult.scoreConfidence[1] * ratio
			if (exceedsLimit && significantlyExceedsLimit) {
				throw new GradleException(
					"${candidate} primary was ${candidateResult.score / baselineResult.score}x " +
						"${baseline}; limit is ${ratio}x"
				)
			}
			if (exceedsLimit) {
				logger.lifecycle(
					"${candidate} exceeded the mean ${ratio}x limit, but the 99.9% " +
						"confidence intervals overlap; treating the result as inconclusive"
				)
			}
		}
		def requireMetricNoMoreThan = { candidate, parameters, limit, metric ->
			def candidateScore = findScore(candidate, parameters, metric)
			if (candidateScore > limit) {
				throw new GradleException(
					"${candidate} ${metric} was ${candidateScore}; limit is ${limit}"
				)
			}
		}

		requireAtMost('voxLibIntegralCuboid', 'vanillaIntegralCuboid', [:], 1.10)
		requireAtMostUnlessInconclusive(
			'voxLibFractionalCuboid',
			'vanillaFractionalCuboid',
			[:],
			1.10
		)
		requireAtMost('voxLibColdBinaryUnion', 'vanillaColdBinaryUnion', [boxCount: 1], 1.10)
		requireAtMost('voxLibColdBinaryUnion', 'vanillaColdBinaryUnion', [boxCount: 8], 1.10)
		requireAtMost('voxLibColdMultiUnion', 'vanillaColdMultiUnion', [shapeCount: 32], 1.10)
		requireAtMost('voxLibColdRotation', 'legacyColdRotation', [:], 1.10)
		requireAtMost('voxLibWarmBinaryUnion', 'vanillaBinaryUnion', [boxCount: 8], 0.50)
		requireAtMost(
			'voxLibWarmRotation',
			'legacyUncachedRotation',
			[boxCount: 32, transformation: 'ROTATE_RIGHT'],
			0.50
		)
		requireAtMost('table', 'legacyTable', [:], 0.50)
		requireAtMost('chair', 'legacyChair', [:], 0.50)
		// 32 inputs exceed MAX_CACHED_UNION_SHAPES, so this is the uncached allocation path.
		requireMetricAtMost(
			'voxLibMultiUnion',
			'vanillaMultiUnion',
			[shapeCount: 32],
			1.00,
			'gc.alloc.rate.norm'
		)
		requireMetricAtMost(
			'voxLibUncachedRotationCore',
			'legacyUncachedRotationCore',
			[:],
			1.00,
			'gc.alloc.rate.norm'
		)
		requireMetricAtMost(
			'specializedCachedUnion',
			'legacyCachedUnion',
			[:],
			0.50,
			'gc.alloc.rate.norm'
		)
		requireMetricAtMost(
			'specializedCachedRotation',
			'legacyCachedRotation',
			[:],
			0.50,
			'gc.alloc.rate.norm'
		)
		requireMetricNoMoreThan(
			'specializedCachedRotation',
			[:],
			8.0,
			'gc.alloc.rate.norm'
		)
		[32, 64].each { boxCount ->
			requireAtMostUnlessInconclusive(
				'voxLibSimplifier',
				'legacySimplifier',
				[boxCount: boxCount, maxBoxes: 8],
				1.00
			)
		}
		[1, 8].each { maxBoxes ->
			def parameters = [boxCount: 256, maxBoxes: maxBoxes]
			requireAtMost(
				'voxLibSimplifier',
				'objectQueueSimplifier',
				parameters,
				1.05
			)
			requireMetricAtMost(
				'voxLibSimplifier',
				'objectQueueSimplifier',
				parameters,
				0.70,
				'gc.alloc.rate.norm'
			)
			requireMetricNoMoreThan(
				'voxLibSimplifier',
				parameters,
				2_000_000.0,
				'gc.alloc.rate.norm'
			)
		}
	}
}

tasks.register('performanceCheck') {
	group = 'verification'
	description = 'Runs JMH benchmarks and performance acceptance gates.'
	dependsOn tasks.verifyPerformance
}

