import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
	id 'base'
	id 'fabric-loom' version '1.10-SNAPSHOT' apply false
	id 'org.jetbrains.kotlin.jvm' version '2.3.0' apply false
	id 'me.champeau.jmh' version '0.7.3' apply false
}

allprojects {
	version = rootProject.mod_version
	group = rootProject.maven_group
}

subprojects {
	apply plugin: 'fabric-loom'
	apply plugin: 'org.jetbrains.kotlin.jvm'

	repositories {
		mavenCentral()
	}

	dependencies {
		minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
		mappings "net.fabricmc:yarn:${rootProject.yarn_mappings}:v2"

		implementation("com.github.ben-manes.caffeine:caffeine:${rootProject.caffeine_version}") {
			exclude group: 'org.checkerframework', module: 'checker-qual'
			exclude group: 'com.google.errorprone', module: 'error_prone_annotations'
		}

		testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.2"
		testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.2"
		testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
		testImplementation "org.junit.jupiter:junit-jupiter-params:5.10.2"
	}

	java {
		withSourcesJar()
		toolchain.languageVersion = JavaLanguageVersion.of(17)
		sourceCompatibility = JavaVersion.VERSION_17
		targetCompatibility = JavaVersion.VERSION_17
	}

	tasks.withType(JavaCompile).configureEach {
		options.release.set(17)
	}

	tasks.withType(KotlinCompile).configureEach {
		kotlinOptions.jvmTarget = '17'
	}

	tasks.withType(ProcessResources).configureEach {
		exclude '**/*.xcf'
		exclude 'assets/voxlib/icon_curseforge.png'
	}

	tasks.named('jar') {
		from(rootProject.file('LICENSE')) {
			rename { "${it}_${rootProject.archives_base_name}" }
		}
	}

	tasks.withType(Test).configureEach {
		useJUnitPlatform()
		testLogging.events 'passed', 'skipped', 'failed'
	}
}

// Explicit root tasks also work when invoked with an absolute task path.
tasks.named('assemble') {
	dependsOn ':common:assemble', ':fabric:assemble'
}

tasks.named('check') {
	dependsOn ':common:check', ':fabric:check'
}

tasks.named('clean') {
	dependsOn ':common:clean', ':fabric:clean'
}
