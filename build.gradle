import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
	id 'base'
	id 'fabric-loom' version '1.13.6' apply false
	id 'net.neoforged.moddev' version '2.0.147' apply false
	id 'org.jetbrains.kotlin.jvm' version '2.3.0' apply false
	id 'me.champeau.jmh' version '0.7.3' apply false
}

allprojects {
	version = rootProject.mod_version
	group = rootProject.maven_group
}

subprojects {
	if (project.name != 'neoforge') {
		apply plugin: 'fabric-loom'
	} else {
		apply plugin: 'net.neoforged.moddev'
	}
	apply plugin: 'org.jetbrains.kotlin.jvm'

	repositories {
		mavenCentral()
	}

	dependencies {
		if (project.name != 'neoforge') {
			minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
			mappings loom.officialMojangMappings()
		}

		implementation("com.github.ben-manes.caffeine:caffeine:${rootProject.caffeine_version}") {
			exclude group: 'org.checkerframework', module: 'checker-qual'
			exclude group: 'com.google.errorprone', module: 'error_prone_annotations'
		}
	}

	java {
		withSourcesJar()
		toolchain.languageVersion = JavaLanguageVersion.of(21)
		sourceCompatibility = JavaVersion.VERSION_21
		targetCompatibility = JavaVersion.VERSION_21
	}

	tasks.withType(JavaCompile).configureEach {
		options.release.set(21)
	}

	tasks.withType(KotlinCompile).configureEach {
		kotlinOptions.jvmTarget = '21'
	}

	tasks.withType(ProcessResources).configureEach {
		exclude '**/*.xcf'
		exclude 'assets/voxlib/icon_curseforge.png'
	}

	tasks.named('jar') {
		from(rootProject.file('LICENSE')) {
			rename { "${it}_${rootProject.archives_base_name}" }
		}
	}
}

// Explicit root tasks also work when invoked with an absolute task path.
tasks.named('assemble') {
	dependsOn ':common:assemble', ':fabric:assemble', ':neoforge:assemble'
}

tasks.named('check') {
	dependsOn ':common:check', ':fabric:check', ':neoforge:check'
}

tasks.named('clean') {
	dependsOn ':common:clean', ':fabric:clean', ':neoforge:clean'
}

// Preserve the existing root commands without launching both loaders at once.
tasks.register('runClient') {
    impliesSubProjects = true
    group = 'fabric'
    description = 'Runs the Fabric client. Use :neoforge:runClient for NeoForge.'
    dependsOn ':fabric:runClient'
}

tasks.register('runServer') {
    impliesSubProjects = true
    group = 'fabric'
    description = 'Runs the Fabric server. Use :neoforge:runServer for NeoForge.'
    dependsOn ':fabric:runServer'
}
