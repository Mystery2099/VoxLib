plugins {
    id 'maven-publish'
}

base {
    archivesName = "${rootProject.archives_base_name}-neoforge"
}

neoForge {
    version = rootProject.neoforge_version
    runs {
        configureEach { gameDirectory = project.layout.projectDirectory.dir('run') }
        client { client() }
        server {
            server()
            programArguments.add('--nogui')
        }
    }
    mods {
        voxlib { sourceSet sourceSets.main }
    }
}

sourceSets.main {
    java.srcDir rootProject.file('common/src/main/java')
    kotlin.srcDirs rootProject.file('common/src/main/kotlin'), rootProject.file('common/src/client/kotlin')
    resources.srcDir rootProject.file('common/src/main/resources')
}

dependencies {
    // Runtime libraries are explicit to avoid duplicate annotation modules on the module path.
    additionalRuntimeClasspath("com.github.ben-manes.caffeine:caffeine:${rootProject.caffeine_version}") { transitive = false }
    additionalRuntimeClasspath('org.jetbrains.kotlin:kotlin-stdlib:2.3.0') { transitive = false }
    jarJar('com.github.ben-manes.caffeine:caffeine') {
        version {
            strictly "[${rootProject.caffeine_version},4.0)"
            prefer rootProject.caffeine_version
        }
        transitive = false
    }
    jarJar('org.jetbrains.kotlin:kotlin-stdlib') {
        version {
            strictly '[2.3.0,3.0)'
            prefer '2.3.0'
        }
        transitive = false
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}

// Check the distributable, including its bundled runtime.
def modJar = tasks.named('jar').flatMap { it.archiveFile }
def verifyModJar = tasks.register('verifyModJar') {
    group = 'verification'
    description = 'Checks NeoForge metadata, shared classes, and bundled runtime libraries.'
    dependsOn ':common:verifyCommonJar', 'jar'
    inputs.file(modJar)
    doLast {
        new java.util.zip.ZipFile(modJar.get().asFile).withCloseable { mod ->
            def requireEntry = { name ->
                def entry = mod.getEntry(name)
                if (entry == null) throw new GradleException("NeoForge JAR is missing ${name}")
                entry
            }
            ['VoxLib', 'combination/VoxelAssembly', 'rotation/VoxelRotation',
             'shapes/CommonShapes', 'optimization/ShapeCache', 'optimization/ShapeSimplifier',
             'config/VoxLibConfig', 'config/VoxLibConfigScreen', 'debug/VoxelShapeDebug',
             'debug/VoxelShapeDebugClient', 'neoforge/VoxLibNeoForge',
             'neoforge/VoxLibNeoForgeClient'].each {
                requireEntry("com/github/mystery2099/voxlib/${it}.class")
            }
            requireEntry('META-INF/neoforge.mods.toml')
            requireEntry('assets/voxlib/icon.png')
            requireEntry('pack.mcmeta')
            requireEntry("LICENSE_${rootProject.archives_base_name}")
            if (mod.getEntry('fabric.mod.json') != null) {
                throw new GradleException('NeoForge JAR contains Fabric metadata')
            }
            def bundled = mod.getInputStream(requireEntry('META-INF/jarjar/metadata.json')).withCloseable {
                new groovy.json.JsonSlurper().parse(it)
            }
            ['caffeine', 'kotlin-stdlib'].each { artifact ->
                def library = bundled.jars.find { it.identifier.artifact == artifact }
                if (library == null) throw new GradleException("NeoForge JAR is missing bundled ${artifact}")
                requireEntry(library.path)
            }
        }
    }
}

tasks.named('check') { dependsOn verifyModJar }
tasks.withType(org.gradle.api.publish.maven.tasks.AbstractPublishToMaven).configureEach {
    dependsOn verifyModJar
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact(tasks.named('jar'))
            artifact(tasks.named('sourcesJar'))
            artifactId = "${rootProject.archives_base_name}-neoforge"
            pom {
                name = 'VoxLib NeoForge'
                description = 'Voxel shape utilities for Minecraft NeoForge'
                url = 'https://github.com/Mystery2099/VoxLib'
                licenses {
                    license {
                        name = 'Minecraft Mod Public License 1.0.1'
                        url = 'https://github.com/Mystery2099/VoxLib/blob/master/LICENSE'
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/Mystery2099/VoxLib')
            credentials {
                username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user') ?: 'username'
                password = System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key') ?: 'token'
            }
        }
    }
}
